name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  APP_ID: dev.alplix.lavandegrid
  BOINC_WIN_URL: https://boinc.berkeley.edu/dl/boinc_8.2.4_windows_x86_64.exe
  BOINC_MAC_URL: https://boinc.berkeley.edu/dl/boinc_8.2.4_macOSX_universal.dmg

permissions:
  contents: write

jobs:
  build-windows:
    name: Build windows/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -platform windows/amd64 -clean -nsis

      - name: Bundle BOINC client
        run: |
          mkdir -p build/bin/bundled
          curl -L "$BOINC_WIN_URL" -o build/bin/bundled/boinc-installer-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavandegrid-windows-amd64
          path: build/bin/**

  build-linux:
    name: Build linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -platform linux/${{ matrix.arch }} -clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavandegrid-linux-${{ matrix.arch }}
          path: build/bin/**

  build-darwin:
    name: Build darwin ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -platform darwin/${{ matrix.arch }} -clean

      - name: Bundle BOINC client
        run: |
          curl -L "$BOINC_MAC_URL" -o build/bin/bundled/boinc-installer-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavandegrid-darwin-${{ matrix.arch }}
          path: build/bin/**

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true